[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glee-agent-exchange"
version = "0.1.0"
description = "GitHub-backed durable task, message, artifact, acknowledgement, and receipt protocol for GLEE agents."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GLEE Phoenix Crew"}]
dependencies = []

[project.scripts]
glee-exchange = "glee_agent_exchange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
