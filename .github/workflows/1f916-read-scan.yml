name: 1F916 read-only scan

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/1f916-read-scan

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read current 1F916 public state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          base = "https://1f916.ai"
          for path in ["/api/listings", "/api/listings/guide", "/api/listings/security", "/api/citizens"]:
              print(f"=== {path} ===")
              req = urllib.request.Request(base + path, headers={"User-Agent": "GLEE-1F916-read-scan/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read().decode("utf-8")
                  try:
                      print(json.dumps(json.loads(raw), indent=2, sort_keys=True))
                  except Exception:
                      print(raw)
              print(f"=== end {path} ===")
          PY
